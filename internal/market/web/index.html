<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lamda Market</title><link rel="stylesheet" href="/market/style.css"><script src="/market/app.js" defer></script></head><body>
<aside><a class="brand" href="/market/">λ <span><b>LamdaMarket</b></span></a><nav aria-label="Market views"><button data-view="market" class="active">↗ <span>Market</span></button><button data-view="watchlist">☆ <span>My lists</span></button><button data-view="opportunities">◇ <span>Opportunities</span></button><button data-view="holdings">▤ <span>Holdings</span></button><button data-view="recipes">⚒ <span>Recipe library</span></button><button data-view="characters">♙ <span>Characters</span></button><button data-view="settings">⚙ <span>Research settings</span></button></nav><a class="engine" href="/">← Lamda Engine</a><p class="foot">Local market data</p></aside>
<main><header><div><h1 id="title">Market</h1></div><div class="connection"><i></i><span id="connection">Local workspace</span><button id="refresh" title="Refresh observations" aria-label="Refresh observations">↻</button></div></header>
<div class="marketbar"><label>Market<select id="market"><option value="">Waiting for first export</option></select></label><span id="capture" role="status">No observations yet</span><progress id="scan-progress" aria-label="Auction pages received" hidden></progress><button id="scan-help" type="button">Scan help</button><label class="import">Import observations<input type="file" id="import" accept="application/json,.json"></label></div><div id="error" role="alert" hidden></div>
<section id="summary" class="summary"></section>
<section id="list-toolbar" class="list-toolbar" aria-label="Favorite lists" hidden><label>List<select id="favorite-list" aria-label="Choose a favorite list"></select></label><button id="new-list" type="button">New list</button><button id="rename-list" type="button">Rename</button><button id="delete-list" type="button">Delete list</button><button id="find-list-items" type="button">Find items to add</button><span id="list-summary" class="muted"></span></section>
<section id="tools" class="tools"><input id="search" type="search" placeholder="Find an item…" aria-label="Search items"><div id="periods" class="segments"><button data-days="1">1D</button><button data-days="7" class="active">1W</button><button data-days="30">1M</button><button data-days="365">1Y</button></div><select id="sort" aria-label="Sort items"><option value="manual" hidden>Manual order</option><option value="name" selected>Name A–Z</option><option value="drop">Biggest drops</option><option value="gain">Biggest gains</option><option value="price">Highest price</option><option value="quantity">Most listed</option></select></section>
<section id="item-filters" class="item-filters" aria-label="Item filters" hidden><label>Category<select id="item-class" aria-label="Item category"><option value="">All categories</option></select></label><label>Type<select id="item-subclass" aria-label="Item type" disabled><option value="">All types</option></select></label><button id="clear-item-filters" type="button" hidden>Clear filters</button><button id="add-results-to-list" type="button">Add results to list</button><span id="filter-count" class="muted" role="status"></span><span id="item-filter-help" class="muted" hidden></span></section>
<p id="data-quality" class="muted data-quality" hidden></p><section id="content" aria-live="polite"></section><p class="disclosure">Charts show observed buyout listings, not completed sales. Listed quantity is supply, not trading volume. Gaps between scans contain no observations.</p></main>
<dialog id="detail"><button id="close-detail" class="close" aria-label="Close dialog">×</button><div id="detail-body"></div></dialog>
<template id="empty"><div class="empty"><h2>No auction data</h2><p>Install the optional LamdaMarket module, reload WoW, then open an auction house and choose <b>Scan auctions</b>. Keep its color strip visible while Lamda Engine receives the export.</p><p>Opening a merchant or profession adds observed prices and known recipes. Offline observations can also be imported above.</p><span>No auction observations have been received.</span></div></template>
</body></html>
